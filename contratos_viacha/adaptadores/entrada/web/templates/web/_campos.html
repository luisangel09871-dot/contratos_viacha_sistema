{% if form.non_field_errors %}<div class="msg msg-error">{{ form.non_field_errors }}</div>{% endif %}
{% for campo in form %}
<div class="campo">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.help_text %}<small>{{ campo.help_text }}</small>{% endif %}
  {% for e in campo.errors %}<div class="error">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
